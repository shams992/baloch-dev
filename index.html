<!doctype html>
<html lang="en" class="dark" data-theme="original">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baloch Export Hub — Taking Balochi Creativity to the World</title>
    <meta
      name="description"
      content="Baloch Export Hub is a digital marketplace connecting Balochi creators, artisans, craftsmen, artists, writers and designers with buyers around the world. Create your free store today."
    />
    <meta name="theme-color" content="#0a0f16" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E2A2B'/%3E%3Cg fill='none' stroke='%23D9A441' stroke-width='3'%3E%3Crect x='18' y='18' width='28' height='28'/%3E%3Crect x='18' y='18' width='28' height='28' transform='rotate(45 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5' fill='%232DD4BF'/%3E%3C/svg%3E"
    />
    <style>
      /* First-paint splash to avoid a white flash before the app mounts */
      html { background: #0a0f16; }
      html[data-theme="light"] { background: #f4efe6; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex;
        align-items: center; justify-content: center; flex-direction: column; gap: 14px;
        background: radial-gradient(1200px 600px at 50% -10%, #123, #0a0f16);
        color: #e7eef2; font-family: system-ui, sans-serif;
        transition: opacity .5s ease; pointer-events: none;
      }
      #splash .mark { animation: splash-spin 7s linear infinite; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      try {
        var t = localStorage.getItem('beh-theme')
        if (t === 'dark') t = 'original'
        if (t !== 'original' && t !== 'light' && t !== 'alternative') t = null
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'original'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.classList.toggle('dark', t !== 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <svg class="mark" width="56" height="56" viewBox="0 0 64 64" fill="none">
        <rect x="18" y="18" width="28" height="28" stroke="#D9A441" stroke-width="3" />
        <rect x="18" y="18" width="28" height="28" stroke="#2DD4BF" stroke-width="3" transform="rotate(45 32 32)" />
        <circle cx="32" cy="32" r="5" fill="#D9A441" />
      </svg>
      <p style="margin:0; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; opacity: .7">
        Baloch Export Hub
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
